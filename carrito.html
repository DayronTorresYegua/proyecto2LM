<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/script.js"></script>
</head>
<body>
<header class="cabecera">
  <a href="inicio.html">
    <img class="cabecera__logo" src="assets/logo.png" alt="Logo">
  </a>
  <nav>
    <ul class="cabecera__menu">
      <li><a class="cabecera__menu__enlaces" href="inicio.html">Inicio</a></li>
      <li><a class="cabecera__menu__enlaces" href="adicional.html">Adicional</a></li>
      <li><a class="cabecera__menu__enlaces" href="servicios.html">Servicios</a></li>
      <li><a class="cabecera__menu__enlaces" href="contacto.html">Contacto</a></li>
      <li><a class="cabecera__menu__enlaces" href="productos.html">Productos</a></li>
    </ul>
  </nav>
</header>
<main class="carrito__contenedor">
  <section class="carrito__productos">
    <h1 class="carrito__productos__titulo">Carrito</h1>
    <ul id="carrito-contenido" class="carrito__productos__lista"></ul>
  </section>

  <aside class="carrito__resumen">
    <h2 class="carrito__resumen__titulo">Resumen del pedido</h2>
    <p class="carrito__resumen__total">Total: <span id="carrito-total">$0.00</span></p>
    <button class="carrito__resumen__boton" type="button">Finalizar compra</button>
  </aside>
</main>
<footer class="pie">
  <nav class="pie__redes">
    <a class="pie__redes__enlace" href="https://facebook.com">
      <img src="assets/facebook.png" alt="Facebook"> Facebook</a>
    <a class="pie__redes__enlace" href="https://twitter.com">
      <img src="assets/twitter.png" alt="Twitter"> Twitter</a>
    <a class="pie__redes__enlace" href="https://instagram.com">
      <img src="assets/instagram-logo.png" alt="Instagram"> Instagram</a>
    <a class="pie__redes__enlace" href="https://whatsapp.com">
      <img src="assets/whatsapp.png" alt="WhatsApp"> WhatsApp</a>
  </nav>
</footer>
</body>
</html>
